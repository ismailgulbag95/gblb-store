<!doctype html>
<html lang="tr"><meta charset="utf-8"><title>Müşteri tasarımları</title>
<style>body{margin:0;background:#f8f3e8;font:16px system-ui}canvas{display:block;width:100%;height:90vh}h1{margin:16px 24px;font-size:22px}p{margin:8px 24px}</style>
<h1>Müşteri arketipleri · 3D tasarım önizlemesi</h1><p>Referans görsele göre prosedürel, stilize karakterler</p>
<script type="module">
import * as THREE from 'three';
import { createCustomerMesh, EXTENDED_CUSTOMER_ARCHETYPES } from '../../src/presentation/HumanoidFactory.js';
import { EnvironmentProps } from '../../src/environment/EnvironmentProps.js';
import { Item3DFactory } from '../../src/presentation/Item3DFactory.js';
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf8f3e8);
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xbba78e,2.5));
const light = new THREE.DirectionalLight(0xffffff,3); light.position.set(-5,12,8); scene.add(light);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,30),new THREE.MeshStandardMaterial({color:0xf8f3e8})); floor.rotation.x=-Math.PI/2; floor.position.y=-0.015; scene.add(floor);
const environment={props:new EnvironmentProps()}; const factory=new Item3DFactory();
EXTENDED_CUSTOMER_ARCHETYPES.forEach((archetype,index)=>{
 const actor=createCustomerMesh({id:`design-${index}`,archetype,kind:'shopper'},environment,factory);
 actor.group.position.set((index%7-3)*2.05,0,Math.floor(index/7)*3.2-1.6); actor.group.rotation.y=-0.25;
 actor.bubble.visible=false; actor.cargo.forEach(mesh=>mesh.visible=true); scene.add(actor.group);
});
const camera=new THREE.OrthographicCamera(); camera.position.set(2,10,16); camera.lookAt(0,0.5,0);
function render(){const w=innerWidth,h=innerHeight-100,aspect=w/h;camera.left=-9;camera.right=9;camera.top=9/aspect;camera.bottom=-9/aspect;camera.updateProjectionMatrix();renderer.setSize(w,h);renderer.render(scene,camera);}
addEventListener('resize',render);render();
</script></html>
