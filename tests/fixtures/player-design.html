<!doctype html>
<html lang="tr"><meta charset="utf-8"><title>Oyuncu karakterleri</title>
<style>body{margin:0;background:#f8f3e8;font:16px system-ui}canvas{display:block;width:100%;height:90vh}h1{margin:16px 24px;font-size:22px}p{margin:8px 24px}</style>
<h1>Oyuncu karakterleri · 3D tasarım önizlemesi</h1><p>Referans görsele göre prosedürel, stilize karakterler</p>
<script type="module">
import * as THREE from 'three';
import { CharacterFactory } from '../../src/presentation/CharacterFactory.js';


const scene = new THREE.Scene(); scene.background = new THREE.Color(0xf8f3e8);
const renderer = new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0xbba78e,2.5));
const light = new THREE.DirectionalLight(0xffffff,3); light.position.set(-5,12,8); light.castShadow=true; light.shadow.mapSize.set(1024,1024); scene.add(light);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,30),new THREE.MeshStandardMaterial({color:0xf8f3e8})); floor.rotation.x=-Math.PI/2; floor.position.y=-0.015; floor.receiveShadow=true; scene.add(floor);
const actors = ['shopkeeper', 'cat', 'robot', 'panda', 'penguin'].map((type,index)=>{
 const actor=new CharacterFactory(type); actor.group.position.x=(index-2)*1.65;
 actor.group.rotation.y=-0.3; scene.add(actor.group); return actor;
});
const camera=new THREE.OrthographicCamera(); camera.position.set(2,5,12); camera.lookAt(0,0.8,0);
function render(){const w=innerWidth,h=innerHeight-100,aspect=w/h;camera.left=-5;camera.right=5;camera.top=5/aspect;camera.bottom=-5/aspect;camera.updateProjectionMatrix();renderer.setSize(w,h);renderer.render(scene,camera);}
addEventListener('resize',render);render();
const clock = new THREE.Clock();
function frame(){const dt=Math.min(clock.getDelta(),0.05);actors.forEach(actor=>actor.animate(dt,true));renderer.render(scene,camera);requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></html>
